<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b140f;--wood:#3a2a1d;--wood2:#4b3524;--wood3:#2a1e15;--paper:#efe2c4;--paper2:#e4d3ae;--gold:#d9a441;--goldhi:#f1d58a;--rust:#a8442a;--parch:#f1e3c4;--pink:#5e4830}
*{box-sizing:border-box}html,body{margin:0;background:#241a12;color:var(--parch);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;overflow:hidden}
#pg{width:1200px;position:relative}
.wood{background-color:var(--wood);background-image:repeating-linear-gradient(92deg,rgba(255,255,255,.025) 0 3px,transparent 3px 11px),repeating-linear-gradient(88deg,rgba(0,0,0,.08) 0 2px,transparent 2px 23px)}
.paper{background:var(--paper);color:var(--ink);background-image:radial-gradient(rgba(120,90,50,.08) 1px,transparent 1.4px);background-size:7px 7px}
.ink{border:3px solid var(--ink);box-shadow:0 6px 0 rgba(20,14,9,.55)}
.disp{font-family:Lalezar,"IBM Plex Sans Arabic",sans-serif;font-weight:400}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:12px;font:400 26px Lalezar,sans-serif;text-decoration:none;color:var(--ink);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.btn.gold{background:var(--goldhi)}.btn.pap{background:var(--paper)}
.h2{display:inline-block;margin:0 auto;padding:10px 34px 12px;font:400 44px Lalezar,sans-serif;color:var(--goldhi);border-radius:12px;text-shadow:0 3px 0 var(--ink)}
.center{text-align:center}
</style></head><body><div id="pg">
<style>
.hero{position:relative;height:640px;overflow:hidden}
.hero .bg{position:absolute;inset:0;background:url(https://cdn.jsdelivr.net/gh/sweeli7/dar-alhikma-assets@ea30cf855963908cc292f636bf60fa17e0c6acf9/assets/bg_lobby.avif) center 38%/cover;transform:scale(1.04)}
.hero .shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(20,14,9,.25),rgba(20,14,9,.86) 75%),linear-gradient(0deg,rgba(20,14,9,.9),transparent 40%)}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.title{margin:0;font:400 150px/1.05 Lalezar;color:var(--goldhi);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 9px 0 rgba(20,14,9,.7)}
.sub{margin:6px 0 34px;font:700 30px "IBM Plex Sans Arabic";color:var(--parch);text-shadow:0 2px 0 var(--ink)}
.go{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:16px;padding:6px 70px 12px;border-radius:18px;font:400 54px/1.25 Lalezar;color:var(--ink);background:var(--goldhi);border:4px solid var(--ink);box-shadow:0 9px 0 var(--ink);transition:transform .15s,box-shadow .15s;animation:pulse 2.4s ease-in-out infinite}
.go:hover{transform:translateY(4px);box-shadow:0 5px 0 var(--ink)}
.go svg{width:40px;height:40px}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
.credit{position:absolute;bottom:58px;left:0;right:0;text-align:center;font:600 18px "IBM Plex Sans Arabic";color:var(--parch);opacity:.9}
.credit b{color:var(--goldhi)}
.more{position:absolute;bottom:16px;left:0;right:0;text-align:center;font:600 16px "IBM Plex Sans Arabic";color:var(--gold);animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
#app{position:fixed;inset:0;width:100vw;height:100vh;border:0;display:none;background:#241a12;z-index:9}
</style>
<section class="hero">
 <div class="bg"></div><div class="shade"></div>
 <div class="c">
  <h1 class="title">دار الحكمة</h1>
  <div class="sub">متحف تفاعليّ حيّ لمناهج الصف العاشر</div>
  <button class="go" id="go"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>ابدأ</button>
 </div>
 <div class="credit">إعداد المعلم: <b>صالح جاسم العطيه</b> · صُنع بالكامل باستخدام Gemini</div>
 <div class="more">مرّر للأسفل لتعرف أكثر عن المتحف ↓</div>
</section>
</div><iframe id="app" allow="fullscreen; autoplay" allowfullscreen></iframe>
<script>
var APP_HTML=null, appUrl='https://cdn.jsdelivr.net/gh/sweeli7/dar-alhikma-assets@ea30cf855963908cc292f636bf60fa17e0c6acf9/app.html', fr=document.getElementById('app');
fetch(appUrl).then(function(r){return r.text()}).then(function(t){APP_HTML=t});
function load(){ if(APP_HTML){fr.srcdoc=APP_HTML} else { fr.srcdoc='<body style="margin:0;background:#241a12;color:#f1e3c4;display:grid;place-items:center;height:100vh;font:600 22px Tahoma">جارٍ فتح المتحف…</body>'; var w=setInterval(function(){ if(APP_HTML){clearInterval(w);fr.srcdoc=APP_HTML} },300); } }
document.getElementById('go').onclick=function(){
  fr.style.display='block';
  var fs=fr.requestFullscreen||fr.webkitRequestFullscreen;
  try{ var p=fs&&fs.call(fr); if(p&&p.catch)p.catch(function(){}); }catch(e){}
  load();
};
function onfs(){ if(!(document.fullscreenElement||document.webkitFullscreenElement)){ fr.style.display='none'; fr.removeAttribute('srcdoc'); fr.src='about:blank'; } }
document.addEventListener('fullscreenchange',onfs); document.addEventListener('webkitfullscreenchange',onfs);
</script><script>
function fit(){var z=innerWidth/1200;document.getElementById('pg').style.zoom=z;}fit();addEventListener('resize',fit);
</script></body></html>
